{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="card">
  <h2>Change your password</h2>
  <form method="post" action="/account/password">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="current">Current password</label>
    <input id="current" name="current" type="password" required autocomplete="current-password">

    <label for="password">New password</label>
    <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
    <small>At least 8 characters, with an uppercase letter, a lowercase letter, a digit and a symbol.</small>

    <label for="confirm">Repeat new password</label>
    <input id="confirm" name="confirm" type="password" required minlength="8" autocomplete="new-password">

    <label>
      <input type="checkbox" id="show_password">
      Show passwords
    </label>

    <button type="submit">Change password</button>
  </form>
  <p>Changing your password signs you out on every other device.</p>
</div>

<script>
  document.getElementById("show_password").addEventListener("change", function () {
    var type = this.checked ? "text" : "password";
    ["current", "password", "confirm"].forEach(function (id) {
      document.getElementById(id).type = type;
    });
  });
</script>
{% endblock %}
