{% extends "base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<div class="card">
  <h2>Choose a new password</h2>
  <form method="post" action="/reset/{{ token }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="password">New password</label>
    <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
    <small>At least 8 characters, with an uppercase letter, a lowercase letter, a digit and a symbol.</small>

    <label for="confirm">Repeat new password</label>
    <input id="confirm" name="confirm" type="password" required minlength="8" autocomplete="new-password">

    <label>
      <input type="checkbox" id="show_password">
      Show passwords
    </label>

    <button type="submit">Change password</button>
  </form>
</div>

<script>
  document.getElementById("show_password").addEventListener("change", function () {
    var type = this.checked ? "text" : "password";
    document.getElementById("password").type = type;
    document.getElementById("confirm").type = type;
  });
</script>
{% endblock %}
